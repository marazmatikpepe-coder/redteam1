name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Подобрать актуальные версии Fabric для Minecraft 1.21.11
        run: |
          MC=1.21.11
          YARN=$(curl -s "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -s "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER api=$API"
          if [ -n "$YARN" ] && [ "$YARN" != "null" ]; then sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties; fi
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties; fi
          if [ -n "$API" ] && [ "$API" != "null" ]; then sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties; fi
          cat gradle.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-client-jar
          path: build/libs/redteam-client-0.1.0.jar
